[project]
name = "aemet-pipeline"
version = "0.1.0"
description = "Pipeline ETL de predicción meteorológica de AEMET OpenData"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
