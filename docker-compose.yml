# Despliegue de producción en el homelab.
#
# - postgres: almacenamiento persistente de las predicciones.
# - pipeline: NO se queda corriendo; ofelia lo lanza como un contenedor
#   nuevo (job-run) cada 3 horas y lo destruye al terminar.
# - ofelia: cron nativo de Docker, mismo patrón usado ya en el resto del
#   homelab de "un servicio, un stack".
# - metabase: dashboard para consultar el histórico (solo accesible dentro
#   de la red homelab / vía Nginx Proxy Manager, nunca expuesto a internet).
#
# Requiere la red externa "homelab" ya creada (docker network create homelab)
# y un fichero .env junto a este compose (ver .env.example).

services:
  postgres:
    image: postgres:16-alpine
    container_name: aemet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aemet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aemet
    volumes:
      - aemet_postgres_data:/var/lib/postgresql/data
    networks:
      - homelab

  # Imagen que ofelia lanzará periódicamente. No tiene "restart" ni queda
  # corriendo: build once, ofelia crea instancias efímeras a partir de ella.
  pipeline:
    build: .
    image: aemet-pipeline:latest
    profiles: ["build-only"]

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: aemet-ofelia
    command: daemon --docker
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab
    labels:
      ofelia.job-run.aemet-pipeline.schedule: "0 0 */3 * * *"
      ofelia.job-run.aemet-pipeline.image: "aemet-pipeline:latest"
      ofelia.job-run.aemet-pipeline.network: "homelab"
      ofelia.job-run.aemet-pipeline.delete: "true"
      ofelia.job-run.aemet-pipeline.environment: >-
        ["AEMET_API_KEY=${AEMET_API_KEY}",
        "AEMET_MUNICIPIO_ID=${AEMET_MUNICIPIO_ID}",
        "DATABASE_URL=postgresql+psycopg2://aemet:${POSTGRES_PASSWORD}@aemet-postgres:5432/aemet",
        "UPTIME_KUMA_PUSH_URL=${UPTIME_KUMA_PUSH_URL}"]

  metabase:
    image: metabase/metabase:latest
    container_name: aemet-metabase
    restart: unless-stopped
    depends_on:
      - postgres
    # Heap y threads de Jetty acotados: es un dashboard personal sobre una
    # tabla de unas pocas filas al día, no hace falta el heap por defecto
    # (Metabase suele recomendar 1GB+; aquí le basta con una fracción).
    environment:
      JAVA_OPTS: "-Xmx512m"
      MB_JETTY_MAXTHREADS: "8"
      # Sin esto, la cuenta de admin y la conexión a Postgres que se
      # configuran en el asistente web viven en la capa efímera del
      # contenedor: cualquier recreación (Terraform, un redeploy, lo que
      # sea) las borraría sin aviso.
      MB_DB_FILE: /metabase-data/metabase.db
    mem_limit: 1536m
    ports:
      - "3010:3000"
    networks:
      - homelab
    volumes:
      - aemet_metabase_data:/metabase-data

networks:
  homelab:
    external: true

volumes:
  aemet_postgres_data:
  aemet_metabase_data:
